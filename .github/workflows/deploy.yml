name: Deploy ShetkariHit

on:
  push:
    branches: [sarthak/shetkarihit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shetkarihit-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/sarthak/shetkarihit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate configuration, install, test and build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          node scripts/check-public-config.mjs
          npm ci --no-audit --no-fund
          npm ls --depth=0
          npm run lint --if-present
          npm test
          npm run build
          for file in index.html sw.js retire-api-cache.js manifest.webmanifest; do test -s "dist/$file"; done
          compgen -G 'dist/assets/*.js' > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Verify AWS account before upload
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = '818783923752'
          echo "Verified AWS account $account"
      - name: Publish assets, then entry points
        working-directory: dist
        run: |
          set -euo pipefail
          aws s3 sync assets/ "s3://$SITE_BUCKET/assets/" --size-only --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp . "s3://$SITE_BUCKET/" --recursive --exclude 'assets/*' --exclude index.html --exclude sw.js --cache-control no-cache --only-show-errors
          for file in index.html sw.js; do
            aws s3 cp "$file" "s3://$SITE_BUCKET/$file" --cache-control no-cache --only-show-errors
          done
      - name: Invalidate CloudFront and verify the release over HTTPS
        working-directory: dist
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          site=https://d13loewuo578uu.cloudfront.net
          for route in / /today; do
            curl --fail --silent --show-error "$site$route" | cmp index.html -
          done
          for file in assets/* sw.js manifest.webmanifest; do
            curl --fail --silent --show-error "$site/$file" | cmp "$file" -
          done
